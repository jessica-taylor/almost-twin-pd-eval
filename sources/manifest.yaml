# URLs and extraction preferences. No downloaded article text belongs in git.
schema_version: 1
sources:
  cdt:
    title: "Causal Decision Theory"
    authoring_organization: "Stanford Encyclopedia of Philosophy"
    url: "https://plato.stanford.edu/entries/decision-causal/"
    source_format: html
    extraction: "main article body to Markdown; preserve math, sections and examples"
    redistribution: "restricted — see https://plato.stanford.edu/info.html"
  edt:
    title: "Decision Theory"
    authoring_organization: "Stanford Encyclopedia of Philosophy"
