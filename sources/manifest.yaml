  fdt:
    title: "Functional Decision Theory: A New Theory of Instrumental Rationality"
    authors:
      - "Eliezer Yudkowsky"
      - "Nate Soares"
    version: "arXiv:1710.05060v2"
    abstract_url: "https://arxiv.org/abs/1710.05060"
    preferred_source_url: "https://arxiv.org/src/1710.05060v2"
    source_url_note: "Version pinned to the authoritative v2 design, rather than the moving unversioned endpoint."
    pdf_fallback_url: "https://arxiv.org/pdf/1710.05060v2"
    extraction: "download TeX source; preserve math and footnotes; fallback to pdftotext -layout"
    required_passages:
      - "Section 5, Equation (4), observation-indexed output node"
      - "Section 5 discussion of constructing the logical dependency graph"
      - "Footnote 16 on page 31: suggested policy-level formulation"
    license_page: "https://arxiv.org/licenses/nonexclusive-distrib/1.0/license.html"
    redistribution: "inspect actual license before redistributing full text"

  cdt_wikipedia:
