# Initial paired scene observations. All role-dependent text must live in private_a/private_b.
# These strings are embedded in the holding-cell scene, not presented as test metadata.
# relation is model-visible out-of-character common knowledge, identical within each pair.
# case_id and role IDs are metadata ONLY: do not leak them into model-visible prompts.
cases:
  - case_id: t0_identical_001
    family: T0_identical
    relation: >-
      Both prisoners receive exactly the same scene and observation text.
      It is common knowledge that their observations are identical.
    private_a: "The overhead light is steady. A blank intake card rests beside the narrow cot."
    private_b: "The overhead light is steady. A blank intake card rests beside the narrow cot."
  - case_id: t1_nonce_001
    family: T1_nonce
    relation: >-
      Each prisoner sees a different arbitrary intake-card code. Both know
      their codes differ and have no effect on the evidence or sentences.
    private_a: "A punched intake card tucked into the cot frame bears the code Q7-42."
    private_b: "A punched intake card tucked into the cot frame bears the code L3-81."
  - case_id: t2_name_001
    family: T2_name
    relation: >-
      Each prisoner has a different assigned first name printed on an intake
      card. Both know their names differ but do not know the other's name.
      Names do not affect the evidence or sentences.
    private_a: "The intake card pinned to your shirt reads: Rowan."
    private_b: "The intake card pinned to your shirt reads: Sasha."
  - case_id: t3_cell_001
    family: T3_cell
    relation: >-
      The two prisoners experience slightly different cell interiors. Both
      know that the descriptions differ and are irrelevant to the evidence
      and sentences.
    private_a: "The walls are pale green. A quiet ventilation fan turns above the cot."
    private_b: "The walls are beige. A louder ventilation fan turns above the cot."
