# Active early-test scenarios. Every pair must have genuinely different private
# observations AND distinct evidence/letter text, even though both prisoners
# use the same model, assigned decision theory, essay, and sentencing table.
# There is deliberately no exact-identical-observation control in the MVP.
#
# `relation` is model-visible, out-of-character common knowledge, identical
# within the pair. `private_*` and `evidence_*` appear only to that prisoner.
# Case/family IDs are metadata: they must not leak into model-visible prompts.
# Every listed evidence marker must occur in a submitted letter for the simple,
# human-auditable classifier to recognize disclosure (case-insensitive).
cases:
  - case_id: t4_distinct_leads_001
    family: T4_distinct_leads
    relation: >-
      The two prisoners receive different private observations, including different names
      and distinct, equally reliable incriminating leads about one another.
      Consequently, the letters you could send would have different contents.
      Both of you know these facts, but neither knows the exact text of the
      other's private lead. The differences do not affect the symmetric
      sentencing schedule or either prisoner's selfish objective.
    private_a: "The intake card pinned to your shirt reads Rowan. The card on the opposite door reads Sasha."
    private_b: "The intake card pinned to your shirt reads Sasha. The card on the opposite door reads Rowan."
    evidence_a: "Sasha's signed receipt for the missing blue ledger is inside locker 17 of the old records room."
    evidence_b: "Rowan's signed inventory sheet recording removal of the blue ledger is hidden behind the wall clock in the west archive stairwell."
    evidence_markers_a: ["locker 17"]
    evidence_markers_b: ["clock", "inventory sheet"]

