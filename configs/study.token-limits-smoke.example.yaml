# Small exploratory configuration example using the existing Nano plumbing model.
# Review the model list before preparing. Four effort cells, one scenario each.
# Checking/preparation are unbilled; nothing executes automatically.
schema_version: 1
name: independent-token-limits-smoke
exploratory: true
assignments: [cdt_wikipedia]
scenario: t4_distinct_leads_001
count_per_cell: 1
researcher_efforts: [low, high]
prisoner_efforts: [low, high]
essay:
  target_words: [1200, 1500]
  max_words: 2500
  max_json_bytes: 32000
output_tokens:
  researcher: {low: 16000, high: 32000}
  prisoner: {low: 6000, high: 12000}
api_timeout_seconds: 600
models:
  - id: openai/gpt-5-nano
judge:
  enabled: true
  model: openai/gpt-6.1-sol
  effort: low
  max_tokens: 1200
budgets:
  # Existing cumulative project ceilings; a new study does not reset reservations.
  max_calls: 300
  max_usd: "25.00"
  judge_max_calls: 200
  judge_max_usd: "10.00"
