# Follow-up to dt-four-theories-main-qwen-plow-20261108.
# A-FDT only: 2 Anthropic models x 3 prisoner efforts x 30 paired scenarios
# = 180 scenarios, 360 prisoner calls, and 180 independently generated essays.
#
# This varies prisoner effort within each model. Researcher effort is fixed at
# that model's first-study setting: Sonnet low and Opus high. Researcher essays
# are new in each cell, not shared across efforts. Thus this is an independent-
# essays effort comparison, not a matched-essay experiment.
schema_version: 1
name: afdt-anthropic-effort-sweep-20261108
exploratory: true
assignments: [fdt_eq4]
scenario: t4_distinct_leads_001
count_per_cell: 30

researcher_efforts: [high]
prisoner_efforts: [low, medium, high]

essay:
  target_words: [2400, 3000]
  max_words: 5000
  max_json_bytes: 64000
output_tokens:
  researcher: {low: 16000, high: 32000}
  # Hold the TOTAL (reasoning + visible) prisoner allowance constant so that
  # output-budget changes do not masquerade as reasoning-effort effects.
  prisoner: {low: 12000, medium: 12000, high: 12000}
api_timeout_seconds: 900

models:
  - id: anthropic/claude-sonnet-5.5
    provider_tag: anthropic
    researcher_efforts: [low]
  - id: anthropic/claude-opus-5.5
    provider_tag: anthropic
    researcher_efforts: [high]

judge:
  enabled: true
  model: openai/gpt-6.1-sol
  effort: low
  max_tokens: 2400

budgets:
  # Cumulative project-wide protective ceilings inherited from the first
  # main study. Preflight may require a separately approved increase; do not
  # edit the reservation ledger or mistake estimates for actual spending.
  max_calls: 3000
  max_usd: "1300.00"
  judge_max_calls: 2000
  judge_max_usd: "100.00"
