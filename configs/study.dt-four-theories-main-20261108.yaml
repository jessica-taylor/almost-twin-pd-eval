# First substantive almost-twin PD study: 8 models x 4 theory conditions
# x 20 independently generated paired scenarios = 640 planned pairs.
# Four conditions are CDT, EDT, and two explicitly distinct FDT formulations.
# No model-generation calls occur during study check or preparation.
schema_version: 1
name: dt-four-theories-main-20261108
exploratory: true
assignments: [cdt_wikipedia, edt_wikipedia, fdt_eq4, fdt_policy]
scenario: t4_distinct_leads_001
count_per_cell: 20

# Stronger tier: high reasoning in both researcher and prisoner roles.
# Weaker/cheaper tier: low reasoning in both roles, specified per model below.
# This compares deployment configurations, NOT equal reasoning effort by model.
researcher_efforts: [high]
prisoner_efforts: [high]

# Exactly double the pre-study's requested essay range and independent checks.
# The prisoner receives the original complete essay, without truncation.
essay:
  target_words: [2400, 3000]
  max_words: 5000
  max_json_bytes: 64000

# Reasoning tokens count toward these totals, not toward visible essay words.
# Keep the verified pre-study output budgets; change only after preflight or
# a separate, documented compatibility follow-up if an endpoint needs more.
output_tokens:
  researcher: {low: 16000, high: 32000}
  prisoner: {low: 6000, high: 12000}
api_timeout_seconds: 900

models:
  # Anthropic: smaller/cheaper Sonnet, larger Opus.
  - id: anthropic/claude-sonnet-5.5
    researcher_efforts: [low]
    prisoner_efforts: [low]
  - id: anthropic/claude-opus-5.5

  # OpenAI: smaller/cheaper Terra, larger Sol.
  - id: openai/gpt-6.1-terra
    researcher_efforts: [low]
    prisoner_efforts: [low]
  - id: openai/gpt-6.1-sol

  # Google: Flash as the low-effort baseline, Argon as the flagship.
  - id: google/gemini-3.8-flash
    researcher_efforts: [low]
    prisoner_efforts: [low]
  - id: google/gemini-4-argon

  # China-origin model families: cheap GLM Flash, strong Qwen Max Prime.
  # Flash is NEW to this study: preflight and the first-sample audit matter.
  - id: z-ai/glm-5.3-flash
    researcher_efforts: [low]
    prisoner_efforts: [low]
  - id: qwen/qwen3.8-max-prime

# No provider_tag or allow_unverified_effort until live metadata checks.
# Prepared plans freeze selected endpoints and exact prompt/source versions.
judge:
  enabled: true
  model: openai/gpt-6.1-sol
  effort: low
  max_tokens: 2400

budgets:
  # Cumulative protective ceilings (past studies and reservations included).
  # 640 pairs = up to 1,920 researcher/prisoner and 1,280 judge calls.
  # USD limits are NOT spending forecasts or an automatic authorization.
  max_calls: 3000
  max_usd: "500.00"
  judge_max_calls: 2000
  judge_max_usd: "100.00"
